name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install -r requirements-test.txt
      - run: ruff check .
      - run: ruff format --check custom_components/intesisbox tests scripts
      - run: python -m unittest discover -s tests/protocol -v
      - run: pytest tests/ha -q
